services:
  postgis:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: postgis_container
    ports:
      - "5432:5432"
    environment: 
      POSTGRES_DB: gis_db
      POSTGRES_USER: gis_user
      POSTGRES_PASSWORD: gis_password
    volumes:
      - postgis_data:/var/lib/postgresql/data

  geoserver:
    image: kartoza/geoserver:2.25.0
    container_name: geoserver_container
    depends_on:
      - postgis
    ports: 
      - "8080:8080"
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver_password
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET, POST, PUT, DELETE, HEAD, OPTIONS"
      CORS_ALLOWED_HEADERS: "*"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir


volumes:
  postgis_data:
  geoserver_data: